<svg viewBox="0 0 720 336" xmlns="http://www.w3.org/2000/svg" width="720" height="336" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <rect x="0" y="0" width="720" height="336" fill="#0d1117" stroke="#30363d"/>

  <!-- title bar -->
  <rect x="0" y="0" width="720" height="26" fill="#161b22"/>
  <circle cx="16" cy="13" r="4" fill="#ff5f56"/>
  <circle cx="30" cy="13" r="4" fill="#ffbd2e"/>
  <circle cx="44" cy="13" r="4" fill="#27c93f"/>
  <text x="360" y="17" text-anchor="middle" fill="#7d8590" font-size="10.5">agent — prompt</text>

  <text x="24" y="52" fill="#7d8590" font-size="11">每次请求按以下顺序组装提示词，交给模型：</text>

  <g font-size="11.5">
    <rect x="24" y="66" width="672" height="30" fill="#111820" stroke="#1f3348"/>
    <text x="42" y="85" fill="#79c0ff">system</text>
    <text x="150" y="85" fill="#8b98b8">系统提示词 —— 智能体的人设与行为准则</text>

    <rect x="24" y="102" width="672" height="30" fill="#111820" stroke="#1f3348"/>
    <text x="42" y="121" fill="#79c0ff">rules</text>
    <text x="150" y="121" fill="#8b98b8">项目规则 —— 团队约定与领域知识</text>

    <rect x="24" y="138" width="672" height="30" fill="#111820" stroke="#1f3348"/>
    <text x="42" y="157" fill="#79c0ff">context</text>
    <text x="150" y="157" fill="#8b98b8">动态上下文 —— 随每轮对话变化的背景信息</text>

    <rect x="24" y="174" width="672" height="30" fill="#111820" stroke="#1f3348"/>
    <text x="42" y="193" fill="#79c0ff">history</text>
    <text x="150" y="193" fill="#8b98b8">历史对话 —— 已发生的多轮交互</text>

    <rect x="24" y="210" width="672" height="30" fill="#0f1c18" stroke="#20544a"/>
    <text x="42" y="229" fill="#a7f3d0">message</text>
    <text x="150" y="229" fill="#7fb8a6">当前用户消息 —— 这一轮真正要问的话</text>

    <rect x="24" y="246" width="672" height="30" fill="#111820" stroke="#1f3348"/>
    <text x="42" y="265" fill="#79c0ff">tool_io</text>
    <text x="150" y="265" fill="#8b98b8">工具往返 —— 本轮调用工具的记录与结果</text>
  </g>

  <text x="24" y="308" fill="#3fb950" font-size="12">▼</text>
  <text x="44" y="308" fill="#8b98b8" font-size="11.5">assemble → LLM</text>
</svg>
