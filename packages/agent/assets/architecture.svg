<svg viewBox="0 0 720 410" xmlns="http://www.w3.org/2000/svg" width="720" height="410" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <rect x="0" y="0" width="720" height="410" fill="#0d1117" stroke="#30363d"/>

  <!-- title bar -->
  <rect x="0" y="0" width="720" height="26" fill="#161b22"/>
  <circle cx="16" cy="13" r="4" fill="#ff5f56"/>
  <circle cx="30" cy="13" r="4" fill="#ffbd2e"/>
  <circle cx="44" cy="13" r="4" fill="#27c93f"/>
  <text x="360" y="17" text-anchor="middle" fill="#7d8590" font-size="10.5">agent — architecture</text>

  <!-- ===== 智能体 ===== -->
  <text x="14" y="76" fill="#6e7681" font-size="10.5">智能体</text>
  <g font-size="10">
    <!-- 数据研究 -->
    <rect x="70" y="40" width="150" height="130" fill="#191026" stroke="#3a2359"/>
    <text x="82" y="59" fill="#d2a8ff" font-size="11.5" font-weight="700">数据研究</text>
    <text x="82" y="72" fill="#6e7681" font-size="9" font-style="italic">联网检索，输出研究报告</text>
    <rect x="82" y="79" width="126" height="1" fill="#3a2359"/>
    <text x="82" y="93" fill="#7fb8a6">＋ 研究人设</text>
    <text x="82" y="107" fill="#79c0ff">＋ web_search 工具</text>
    <text x="82" y="121" fill="#79c0ff">＋ 论文工具</text>
    <text x="82" y="135" fill="#ffa657">＋ 探索型 subAgent</text>
    <!-- Code 编程 -->
    <rect x="230" y="40" width="150" height="130" fill="#191026" stroke="#3a2359"/>
    <text x="242" y="59" fill="#d2a8ff" font-size="11.5" font-weight="700">Code 编程</text>
    <text x="242" y="72" fill="#6e7681" font-size="9" font-style="italic">读写工程文件，完成编写与审查</text>
    <rect x="242" y="79" width="126" height="1" fill="#3a2359"/>
    <text x="242" y="93" fill="#7fb8a6">＋ 编程人设</text>
    <text x="242" y="107" fill="#7fb8a6">＋ 编程流程</text>
    <text x="242" y="121" fill="#79c0ff">＋ 文件系统工具</text>
    <text x="242" y="135" fill="#79c0ff">＋ 命令行工具</text>
    <text x="242" y="149" fill="#ffa657">＋ 搜索 subAgent</text>
    <text x="242" y="163" fill="#ffa657">＋ review subAgent</text>
    <!-- 画布智能体 -->
    <rect x="390" y="40" width="150" height="130" fill="#191026" stroke="#3a2359"/>
    <text x="402" y="59" fill="#d2a8ff" font-size="11.5" font-weight="700">画布智能体</text>
    <text x="402" y="72" fill="#6e7681" font-size="9" font-style="italic">生产 Figma / 流程图等特殊 DSL 画布</text>
    <rect x="402" y="79" width="126" height="1" fill="#3a2359"/>
    <text x="402" y="93" fill="#7fb8a6">＋ 画布设定</text>
    <text x="402" y="107" fill="#7fb8a6">＋ DSL 约定</text>
    <text x="402" y="121" fill="#79c0ff">＋ 文件系统工具</text>
    <text x="402" y="135" fill="#79c0ff">＋ 命令行工具</text>
    <text x="402" y="149" fill="#79c0ff">＋ DSL 操作工具</text>
    <!-- 自定义智能体 -->
    <rect x="550" y="40" width="150" height="130" fill="#191026" stroke="#3a2359"/>
    <text x="562" y="59" fill="#d2a8ff" font-size="11.5" font-weight="700">自定义智能体</text>
    <text x="562" y="72" fill="#6e7681" font-size="9" font-style="italic">自由组合，构建任意场景智能体</text>
    <rect x="562" y="79" width="126" height="1" fill="#3a2359"/>
    <text x="562" y="93" fill="#7fb8a6">＋ 你的提示词</text>
    <text x="562" y="107" fill="#79c0ff">＋ 工具</text>
    <text x="562" y="121" fill="#e6c07b">＋ skill</text>
    <text x="562" y="135" fill="#ffa657">＋ subAgent</text>
  </g>

  <!-- ===== 封装 ===== -->
  <text x="14" y="199" fill="#6e7681" font-size="10.5">封装</text>
  <g font-size="11" text-anchor="middle">
    <rect x="70"  y="180" width="196" height="34" fill="#0f1c18" stroke="#20544a"/><text x="168" y="201" fill="#a7f3d0">CodeAgent</text>
    <rect x="272" y="180" width="196" height="34" fill="#0f1c18" stroke="#20544a"/><text x="370" y="201" fill="#a7f3d0">CanvasAgent</text>
    <rect x="474" y="180" width="226" height="34" fill="#0f1c18" stroke="#20544a"/><text x="587" y="201" fill="#a7f3d0">自定义 Agent</text>
  </g>

  <!-- ===== SDK ===== -->
  <text x="14" y="256" fill="#6e7681" font-size="10.5">SDK</text>
  <rect x="70" y="224" width="630" height="58" fill="#101a26" stroke="#1f3b5c"/>
  <text x="82" y="244" fill="#79c0ff" font-size="12" font-weight="700">基础 Agent</text>
  <g font-size="10" text-anchor="middle" fill="#9db4d0">
    <rect x="196" y="252" width="96" height="22" fill="#0d1622" stroke="#1f3b5c"/><text x="244" y="267">推理循环</text>
    <rect x="300" y="252" width="96" height="22" fill="#0d1622" stroke="#1f3b5c"/><text x="348" y="267">上下文管理</text>
    <rect x="404" y="252" width="96" height="22" fill="#0d1622" stroke="#1f3b5c"/><text x="452" y="267">提示词管理</text>
    <rect x="508" y="252" width="88" height="22" fill="#0d1622" stroke="#1f3b5c"/><text x="552" y="267">流式输出</text>
    <rect x="604" y="252" width="84" height="22" fill="#0d1622" stroke="#1f3b5c"/><text x="646" y="267">历史恢复</text>
  </g>

  <!-- ===== 拓展 ===== -->
  <text x="14" y="316" fill="#6e7681" font-size="10.5">拓展</text>
  <g font-size="10.5">
    <rect x="70"  y="292" width="120" height="42" fill="#111820" stroke="#21324a"/><text x="82" y="310" fill="#9db4d0" font-weight="700">tool</text><text x="82" y="326" fill="#6e7681" font-size="9.5">自定义工具</text>
    <rect x="196" y="292" width="120" height="42" fill="#111820" stroke="#21324a"/><text x="208" y="310" fill="#9db4d0" font-weight="700">skill</text><text x="208" y="326" fill="#6e7681" font-size="9.5">按需加载技能</text>
    <rect x="322" y="292" width="120" height="42" fill="#111820" stroke="#21324a"/><text x="334" y="310" fill="#9db4d0" font-weight="700">subAgent</text><text x="334" y="326" fill="#6e7681" font-size="9.5">独立上下文子体</text>
    <rect x="448" y="292" width="120" height="42" fill="#111820" stroke="#21324a"/><text x="460" y="310" fill="#9db4d0" font-weight="700">plugin</text><text x="460" y="326" fill="#6e7681" font-size="9.5">可开关能力包</text>
    <rect x="574" y="292" width="126" height="42" fill="#111820" stroke="#21324a"/><text x="586" y="310" fill="#9db4d0" font-weight="700">agents.md</text><text x="586" y="326" fill="#6e7681" font-size="9.5">项目规则文档</text>
  </g>

  <!-- ===== 模型 ===== -->
  <text x="14" y="372" fill="#6e7681" font-size="10.5">模型</text>
  <rect x="70" y="354" width="630" height="30" fill="#0f1420" stroke="#21262d"/>
  <text x="385" y="373" text-anchor="middle" fill="#b8c1f0" font-size="10.5">OpenAI · Anthropic · 自建网关 · 本地模型</text>
</svg>
